  }
 }
 if(st.tab==="find"){h=`<h1>Search</h1><div class="sub">Find a food across every restaurant</div><input class="search" id="fq" placeholder="Try chicken, burrito, shake" value="${esc(st.iq)}"><div id="fr"></div><div id="wr"></div>`}
 app.innerHTML=h;wire();window.scrollTo(0,0);
}
function wire(){
 if(st.tab==="rest"&&!st.view){const draw=()=>{const q=st.rq.toLowerCase();const L=Object.keys(R).filter(k=>!q||(R[k].n+" "+R[k].a).toLowerCase().includes(q)).sort((a,b)=>dist(R[a])-dist(R[b]));
   $("#rl").innerHTML=L.length?L.map(k=>`<button class="row" onclick="st.view='${k}';render()"><div class="t"><span class="nm">${esc(R[k].n)}</span><span class="mu">${dist(R[k]).toFixed(1)} mi</span></div><div class="mu">${esc(R[k].a)} · ${ITEMS.filter(i=>i.k===k).length} items</div></button>`).join(""):'<div class="empty">No restaurant found. Send me its name and I\'ll add it.</div>'};
   draw();$("#rq").oninput=e=>{st.rq=e.target.value;draw()};
   $("#loc").onclick=()=>{const b=$("#loc");try{navigator.geolocation.getCurrentPosition(p=>{HOME={la:p.coords.latitude,lo:p.coords.longitude,label:"from you"};render()},()=>{b.textContent="Location blocked here; using 84084"},{timeout:6000})}catch(e){b.textContent="Location blocked here; using 84084"}}}
 if(st.tab==="rest"&&st.view){let sort="ra";const draw=()=>{let L=ITEMS.filter(i=>i.k===st.view&&(st.cat==="All"||i.c===st.cat)&&(!st.iq||i.n.toLowerCase().includes(st.iq)));
   L.sort((a,b)=>sort==="cal"?a.cal-b.cal:b[sort]-a[sort]);$("#items").innerHTML=L.length?L.map(i=>itemRow(i,false)).join(""):'<div class="empty">Nothing matches.</div>'};
   draw();$("#iq").oninput=e=>{st.iq=e.target.value.toLowerCase().trim();draw()};$("#cat").onchange=e=>{st.cat=e.target.value;draw()};$("#srt").onchange=e=>{sort=e.target.value;draw()}}
 if(st.tab==="find"){const draw=()=>{const q=st.iq;if(q.length<2){$("#fr").innerHTML='<div class="empty">Type at least two letters.</div>';return}
   const L=ITEMS.filter(i=>(i.n+" "+i.r+" "+i.c).toLowerCase().includes(q)).sort((a,b)=>b.ra-a.ra).slice(0,40);$("#fr").innerHTML=L.length?L.map(i=>itemRow(i,true)).join(""):'<div class="empty" style="padding:8px 0">No hand-checked match.</div>'};
   let tm=null,seq=0;
   const n=v=>v==null?"–":Math.round(v*10)/10;
   const online=async(q)=>{const box=$("#wr"),my=++seq;
    if(q.length<3){box.innerHTML="";return}
    box.innerHTML='<div class="sub" style="margin-top:14px">Online database</div><div class="empty">Searching…</div>';
    try{const r=await fetch("/api/search?q="+encodeURIComponent(q));const j=await r.json();if(my!==seq)return;
     if(!r.ok){box.innerHTML='<div class="sub" style="margin-top:14px">Online database</div><div class="empty">'+esc(j.error||"Lookup failed")+(j.detail?" ("+esc(j.detail)+")":"")+'</div>';return}
     box.innerHTML='<div class="sub" style="margin-top:14px">Online database (not hand-checked)</div>'+(j.items.length?j.items.map(i=>`<button class="row" onclick="this.classList.toggle('open')"><div class="t"><span class="nm">${esc(i.name)}</span><span class="pp">${n(i.n.p)} g</span></div><div class="mu">${esc(i.brand)}${i.brand?" · ":""}${n(i.n.cal)} cal · per ${esc(i.basis)}${i.verified?"":" · unverified"}</div><div class="det"><b>${n(i.n.p)} g</b> protein · <b>${n(i.n.c)}</b> g carbs · <b>${n(i.n.f)}</b> g fat · <b>${n(i.n.cal)}</b> cal<br>Per ${esc(i.basis)}. Source: ${esc(j.source)} database, not the restaurant itself${i.verified?"":" (unverified entry)"}.</div></button>`).join(""):'<div class="empty">Nothing found online.</div>')+'<div class="foot">'+(j.source==='fatsecret'?'Powered by <a href="https://www.fatsecret.com" style="color:inherit">fatsecret</a>. ':'Source: '+esc(j.source)+'. ')+'Not hand-checked against the restaurant; check for oddities.</div>'
    }catch(e){if(my===seq)box.innerHTML=""}};
   draw();online(st.iq);
   $("#fq").oninput=e=>{st.iq=e.target.value.toLowerCase().trim();draw();clearTimeout(tm);tm=setTimeout(()=>online(st.iq),500)}}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;st.view=null;st.pick=null;st.iq="";st.rq="";st.cat="All";render()});
render();
</script></body></html>
