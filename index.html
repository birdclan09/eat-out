     const noInfo=m=>{bx.innerHTML='<div class="supbox" style="margin:0"><div class="mu">'+m+'</div><div class="pbt" style="grid-template-columns:1fr"><button class="addb" id="pmenu">Restaurant Menu</button></div></div>';bx.querySelector("#pmenu").onclick=()=>openRest(x)};
     try{const j=await loadPlace(x.name);if(!bx.isConnected)return;if(!j.found)noInfo("No location details found for this one.");else showPlace(j,"",bx,"x")}catch(e){if(bx.isConnected)noInfo("Couldn't look up the location right now.")}});
    const all=ITEMS.concat(...MENU.values()),seenI=new Set(),L=all.filter(i=>{const k=norm(i.r+i.n+i.p+i.cal);if(seenI.has(k)||(!i.s&&HID.has(fkey(i))))return false;seenI.add(k);return hit((i.n+" "+i.r+" "+i.c).toLowerCase(),q)}).sort(byFav((a,b)=>b.ra-a.ra)).slice(0,40);
    $("#fr").innerHTML=hd("Foods"+(L.length?" · favorites first, then best protein per calorie":""))+(L.length?L.map(i=>itemRow(i,true)).join(""):'<div class="empty" style="padding:8px 0">No food matched in the menus loaded so far.</div>')};
   let tm=null,seq=0;
   const n=v=>v==null?"–":Math.round(v*10)/10;
   const online=async(q)=>{const box=$("#wr"),my=++seq;
    if(q.length<3){box.innerHTML="";return}
    box.innerHTML='<div class="sub" style="margin-top:14px">Online database</div><div class="empty">Searching…</div>';
    try{const r=await fetch("/api/search?q="+encodeURIComponent(q));const j=await r.json();if(my!==seq)return;
     if(!r.ok){box.innerHTML='<div class="sub" style="margin-top:14px">Online database</div><div class="empty">'+esc(j.error||"Lookup failed")+(j.detail?" ("+esc(j.detail)+")":"")+'</div>';return}
     const have=new Set(ITEMS.concat(...MENU.values()).map(i=>norm(i.n)+Math.round(i.cal)+Math.round(i.p))),fresh=j.items.filter(i=>!have.has(norm(i.name)+Math.round(i.n.cal||0)+Math.round(i.n.p||0)));
     box.innerHTML='<div class="sub" style="margin:16px 0 4px">More from the online database (not hand-checked)</div>'+(fresh.length?fresh.map(i=>`<button class="row" onclick="this.classList.toggle('open')"><div class="t"><span class="nm">${esc(i.name)}</span><span class="pp">${n(i.n.p)} g</span></div><div class="mu">${esc(i.brand)}${i.brand?" · ":""}${n(i.n.cal)} cal · per ${esc(i.basis)}${i.verified?"":" · unverified"}</div><div class="det">${i.brand&&hit(i.brand.toLowerCase(),st.iq)?`<span class="rlink" data-rest="${esc(i.brand)}" role="link">View ${esc(i.brand)} menu ›</span><br>`:""}<b>${n(i.n.p)} g</b> protein · <b>${n(i.n.c)}</b> g carbs · <b>${n(i.n.f)}</b> g fat · <b>${n(i.n.cal)}</b> cal<br>Per ${esc(i.basis)}. Source: ${esc(j.source)} database, not the restaurant itself${i.verified?"":" (unverified entry)"}.</div></button>`).join(""):'<div class="empty">Nothing found online.</div>')+'<div class="foot">'+(j.source==='fatsecret'?'Powered by <a href="https://www.fatsecret.com" style="color:inherit">fatsecret</a>. ':'Source: '+esc(j.source)+'. ')+'Not hand-checked against the restaurant; check for oddities.</div>'
    }catch(e){if(my===seq)box.innerHTML=""}};
   let pseq=0;const tc=t=>t.replace(/\b\w/g,c=>c.toUpperCase()),mbtn=nm=>`<div class="pbt" style="grid-template-columns:1fr;margin-top:8px"><button class="addb" data-rest="${esc(tc(nm))}">View ${esc(tc(nm))} menu ›</button></div>`;
   const placeLook=async()=>{const q=st.iq,box=$("#pc");if(!box)return;const my=++pseq;
    if(q.length<3){box.innerHTML="";return}
    const top=rests(q)[0],FW=/^(salads?|burgers?|burritos?|bowls?|chicken|pizzas?|tacos?|sandwich(es)?|wings?|fries|soups?|steaks?|fish|shrimp|rice|beans?|pasta|breakfast|noodles?|wraps?|eggs?|bagels?|smoothies?|shakes?|sushi|ribs?|nuggets?|protein|vegan|healthy|lunch|dinner|and|with|the|a)$/i;
    if(!top&&q.split(/\s+/).filter(Boolean).every(w=>FW.test(w))){box.innerHTML="";return}
    const nm=(top&&top.name)||(st.iqRaw||q),key=norm(nm)+"|"+HOME.la.toFixed(2)+","+HOME.lo.toFixed(2);
    let j=PLC.get(key);
    if(!j){box.innerHTML=hd("Nearest location")+ldH(nm);
     try{const r=await fetch(`/api/place?v=3&name=${encodeURIComponent(nm)}&lat=${HOME.la}&lon=${HOME.lo}`);j=await r.json();if(my!==pseq)return;if(!r.ok)throw new Error((j.error||"Lookup failed")+(j.detail?" ("+j.detail+")":""));j._t=Date.now();PLC.set(key,j);plcSave()}
     catch(e){if(my!==pseq)return;
      const sn=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,""),want=sn(nm),m=((st.near&&st.near.items)||[]).filter(x=>hit(sn(x.name),want)).sort((a,b)=>a.mi-b.mi)[0];
      if(m){showPlace({found:true,fallback:1,count:1,others:[],place:{name:m.name,addr:m.addr||"",mi:m.mi,la:m.la,lo:m.lo,hours:"",phone:"",website:"",cuisine:m.cuisine||""}},q);return}
      box.innerHTML=hd("Nearest location")+'<div class="empty" style="padding:8px 0">Couldn\'t look up the location right now.<br><span class="mu">'+esc(String(e.message||e).slice(0,160))+'</span></div>'+mbtn(nm);return}}
    if(my!==pseq)return;
    if(!j.found){box.innerHTML=top&&rests(q).length>1?"":hd("Restaurant")+mbtn(nm);return}
    showPlace(j,q)};
   $("#fr").addEventListener("click",async e=>{if(e.target.closest("[data-fav],[data-add],.rx"))return;const row=e.target.closest("button.row");if(!row)return;const nx=row.nextElementSibling,has=nx&&nx.classList.contains("rx");
    if(!row.classList.contains("open")){if(has)nx.remove();return}if(has)return;const f=FREG[row.querySelector("[data-fav]")?.dataset.fav];if(!f||!f.r)return;
    const bx=document.createElement("div");bx.className="rx";bx.innerHTML=ldH(f.r);row.insertAdjacentElement("afterend",bx);setTimeout(()=>bx.scrollIntoView({block:"nearest",behavior:"smooth"}),50);
    const noInfo=m=>{bx.innerHTML='<div class="supbox" style="margin:0"><div class="mu">'+m+'</div></div>'};
    try{const j=await loadPlace(f.r);if(!bx.isConnected)return;if(!j.found)noInfo("No location details found for "+esc(f.r)+".");else {showPlace(j,"",bx,"f");setTimeout(()=>bx.scrollIntoView({block:"nearest",behavior:"smooth"}),80)}}catch(er){if(bx.isConnected)noInfo("Couldn't look up the location for "+esc(f.r)+". "+esc(String(er.message||er).slice(0,120)))}});
   draw();online(st.iq);placeLook();if(!st.near){nearby(HOME.la,HOME.lo,st.rad).then(j=>{if(!st.near)st.near=j;if(st.tab==="find")draw()}).catch(()=>{})}
   $("#fq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(tm);st.iqRaw=e.target.value.trim();st.iq=st.iqRaw.toLowerCase();draw();online(st.iq);placeLook();e.target.blur()}};$("#fq-go").onclick=()=>{clearTimeout(tm);const v=$("#fq").value;st.iqRaw=v.trim();st.iq=st.iqRaw.toLowerCase();draw();online(st.iq);placeLook();$("#fq").blur()};$("#fq").oninput=e=>{st.iqRaw=e.target.value.trim();st.iq=st.iqRaw.toLowerCase();draw();clearTimeout(tm);tm=setTimeout(()=>{online(st.iq);placeLook()},500)}}
}
